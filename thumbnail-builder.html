<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Thumbnail Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        .controls {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            height: fit-content;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .section:last-child {
            border-bottom: none;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #999;
            display: block;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input[type="file"],
        input[type="text"],
        input[type="color"],
        input[type="number"],
        input[type="range"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #0a0a0a;
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
        }

        input[type="range"] {
            padding: 0;
            height: 6px;
        }

        input[type="file"]::file-selector-button {
            background: #ff6b35;
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff6b35;
            border: none;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background: #e55a26;
        }

        .preview-section {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
        }

        .preview-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        #canvasContainer {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            cursor: move;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .text-controls {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            border-left: 3px solid #ff6b35;
        }

        .text-controls h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 12px;
        }

        .range-display {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .button-group button {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h1>Thumbnail Builder</h1>

            <div class="section">
                <label>Format</label>
                <select id="formatSelect">
                    <option value="landscape">Landscape (1280x720)</option>
                    <option value="portrait">Portrait (1080x1920)</option>
                </select>

                <label>Upload Image (Right Side)</label>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <div class="section">
                <label>Navy Panel Color</label>
                <input type="color" id="panelColor" value="#001a4d">

                <label>Panel Diagonal Position (%)</label>
                <input type="range" id="panelWidth" min="20" max="50" value="33">
                <div class="range-display" id="panelWidthDisplay">33%</div>

                <label>Split Line Angle (°)</label>
                <input type="range" id="lineAngle" min="-45" max="45" value="20">
                <div class="range-display" id="lineAngleDisplay">20°</div>

                <label>Split Line Color</label>
                <input type="color" id="lineColor" value="#ff6b35">
            </div>

            <div class="section">
                <div class="text-controls">
                    <h3>Main Title</h3>
                    <label>Text</label>
                    <input type="text" id="mainTitle" placeholder="Enter main title">

                    <label>Font</label>
                    <select id="mainFont">
                        <option>Arial</option>
                        <option>Helvetica</option>
                        <option>Times New Roman</option>
                        <option>Courier</option>
                        <option>Georgia</option>
                        <option>Verdana</option>
                        <option>Comic Sans MS</option>
                        <option>Trebuchet MS</option>
                        <option>Impact</option>
                        <option>Palatino</option>
                        <option>Garamond</option>
                        <option>Bookman</option>
                        <option>Century Gothic</option>
                        <option>Lucida Console</option>
                        <option>Tahoma</option>
                        <option>Lucida Handwriting</option>
                        <option>Segoe UI</option>
                        <option>Calibri</option>
                        <option>Consolas</option>
                        <option>Courier New</option>
                    </select>

                    <label>Font Size</label>
                    <input type="number" id="mainSize" value="48" min="12" max="120">

                    <label>Text Color</label>
                    <input type="color" id="mainColor" value="#ffffff">

                    <label>Position X</label>
                    <input type="number" id="mainX" value="640" min="0">

                    <label>Position Y</label>
                    <input type="number" id="mainY" value="300" min="0">
                </div>
            </div>

            <div class="section">
                <div class="text-controls">
                    <h3>Subtitle</h3>
                    <label>Text</label>
                    <input type="text" id="subTitle" placeholder="Enter subtitle (optional)">

                    <label>Font</label>
                    <select id="subFont">
                        <option>Arial</option>
                        <option>Helvetica</option>
                        <option>Times New Roman</option>
                        <option>Courier</option>
                        <option>Georgia</option>
                        <option>Verdana</option>
                        <option>Comic Sans MS</option>
                        <option>Trebuchet MS</option>
                        <option>Impact</option>
                        <option>Palatino</option>
                        <option>Garamond</option>
                        <option>Bookman</option>
                        <option>Century Gothic</option>
                        <option>Lucida Console</option>
                        <option>Tahoma</option>
                        <option>Lucida Handwriting</option>
                        <option>Segoe UI</option>
                        <option>Calibri</option>
                        <option>Consolas</option>
                        <option>Courier New</option>
                    </select>

                    <label>Font Size</label>
                    <input type="number" id="subSize" value="32" min="12" max="120">

                    <label>Text Color</label>
                    <input type="color" id="subColor" value="#ffffff">

                    <label>Position X</label>
                    <input type="number" id="subX" value="640" min="0">

                    <label>Position Y</label>
                    <input type="number" id="subY" value="380" min="0">
                </div>
            </div>

            <div class="section">
                <div class="button-group">
                    <button onclick="downloadThumbnail('full')">⬇ Download Full Res</button>
                    <button onclick="downloadThumbnail('preview')">⬇ Download Preview</button>
                </div>
            </div>
        </div>

        <div class="preview-section">
            <div class="preview-title">Live Preview (Drag text to reposition)</div>
            <div id="canvasContainer">
                <canvas id="canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let uploadedImage = null;
        let currentFormat = 'landscape';

        function updateCanvasDimensions() {
            if (currentFormat === 'landscape') {
                canvas.width = 1280;
                canvas.height = 720;
            } else {
                canvas.width = 1080;
                canvas.height = 1920;
            }
            draw();
        }

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    uploadedImage = img;
                    draw();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        document.getElementById('formatSelect').addEventListener('change', function(e) {
            currentFormat = e.target.value;
            updateCanvasDimensions();
        });

        document.getElementById('panelWidth').addEventListener('input', function(e) {
            document.getElementById('panelWidthDisplay').textContent = e.target.value + '%';
            draw();
        });

        document.getElementById('lineAngle').addEventListener('input', function(e) {
            document.getElementById('lineAngleDisplay').textContent = e.target.value + '°';
            draw();
        });

        document.querySelectorAll('#panelColor, #lineColor, #mainTitle, #mainFont, #mainSize, #mainColor, #mainX, #mainY, #subTitle, #subFont, #subSize, #subColor, #subX, #subY').forEach(el => {
            el.addEventListener('input', draw);
            el.addEventListener('change', draw);
        });

        function draw() {
            const panelPosition = (parseInt(document.getElementById('panelWidth').value) / 100) * canvas.width;
            const panelColor = document.getElementById('panelColor').value;
            const lineColor = document.getElementById('lineColor').value;
            const lineAngle = parseInt(document.getElementById('lineAngle').value);

            // Background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Calculate line angle
            const angleRad = (lineAngle * Math.PI) / 180;
            const centerY = canvas.height / 2;

            // Calculate where line intersects top and bottom of canvas
            const lineLength = Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height) * 2;
            const topX = panelPosition - Math.sin(angleRad) * (centerY / Math.cos(angleRad));
            const topY = 0;
            const bottomX = panelPosition + Math.sin(angleRad) * ((canvas.height - centerY) / Math.cos(angleRad));
            const bottomY = canvas.height;

            // Fill navy panel - everything left of the line
            ctx.fillStyle = panelColor;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(topX, topY);
            ctx.lineTo(bottomX, bottomY);
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            ctx.fill();

            // Draw orange line
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.moveTo(topX, topY);
            ctx.lineTo(bottomX, bottomY);
            ctx.stroke();

            // Image on right
            if (uploadedImage) {
                const imgWidth = canvas.width * 0.7;
                const imgHeight = canvas.height;
                const scale = Math.max(imgWidth / uploadedImage.width, imgHeight / uploadedImage.height);
                const scaledWidth = uploadedImage.width * scale;
                const scaledHeight = uploadedImage.height * scale;
                const x = canvas.width * 0.3 + (imgWidth - scaledWidth) / 2;
                const y = (imgHeight - scaledHeight) / 2;

                ctx.drawImage(uploadedImage, x, y, scaledWidth, scaledHeight);

                const gradient = ctx.createLinearGradient(canvas.width * 0.3, 0, canvas.width, 0);
                gradient.addColorStop(0, 'rgba(0, 0, 0, 0.3)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(canvas.width * 0.3, 0, imgWidth, imgHeight);
            }

            // Main title
            const mainTitle = document.getElementById('mainTitle').value;
            if (mainTitle) {
                ctx.font = `bold ${parseInt(document.getElementById('mainSize').value)}px ${document.getElementById('mainFont').value}`;
                ctx.fillStyle = document.getElementById('mainColor').value;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(mainTitle, parseInt(document.getElementById('mainX').value), parseInt(document.getElementById('mainY').value));
            }

            // Subtitle
            const subTitle = document.getElementById('subTitle').value;
            if (subTitle) {
                ctx.font = `bold ${parseInt(document.getElementById('subSize').value)}px ${document.getElementById('subFont').value}`;
                ctx.fillStyle = document.getElementById('subColor').value;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(subTitle, parseInt(document.getElementById('subX').value), parseInt(document.getElementById('subY').value));
            }
        }

        function downloadThumbnail(quality) {
            const filename = currentFormat === 'landscape' ?
                `thumbnail-${quality}.png` :
                `thumbnail-portrait-${quality}.png`;

            let exportCanvas = canvas;
            if (quality === 'preview') {
                exportCanvas = document.createElement('canvas');
                exportCanvas.width = canvas.width / 2;
                exportCanvas.height = canvas.height / 2;
                const exportCtx = exportCanvas.getContext('2d');
                exportCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, exportCanvas.width, exportCanvas.height);
            }

            const link = document.createElement('a');
            link.href = exportCanvas.toDataURL('image/png');
            link.download = filename;
            link.click();
        }

        updateCanvasDimensions();
    </script>
</body>
</html>
